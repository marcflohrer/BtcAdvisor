<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weiterleitung zum Signalchart</title>
  <meta http-equiv="refresh" content="0; url=/signals" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #e5e7eb;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      max-width: 560px;
      margin: 24px;
      padding: 24px;
      border: 1px solid #1f2937;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Signalchart wird geöffnet</h1>
    <p>Die alte statische Startseite wurde durch die Blazor-Ansicht ersetzt.</p>
    <p>Falls die Weiterleitung nicht automatisch passiert, öffne <a href="/signals">/signals</a>.</p>
  </div>
  <script>
    window.location.replace('/signals');
  </script>
</body>
</html>
