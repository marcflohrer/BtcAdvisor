services:
    web:
        build:
            context: .
        ports:
            - "${HttpPort}:6003"  # HTTP-Port
        environment:
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DatabasePassword};SslMode=Disable;"
            ApiSettings__MarketDataAppApiKey: "${MARKETDATA_APP_APIKEY}"
            TelegramBotOptions__TelegramBotSecret: "${TELEGRAM_BOT_SECRET}"
            TelegramBotOptions__ChatIds: "${TELEGRAM_CHAT_IDS}"
            ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
            DOTNET_RUNNING_IN_CONTAINER: 1
            DOTNET_TieredPGO: 1
            DOTNET_TC_QuickJitForLoops: 1
            DOTNET_TieredCompilation: 1
            DOTNET_TC_QuickJit: 1
            DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 0
            DOTNET_SYSTEM_NET_DISABLEIPV6: 1
            DOTNET_ReadyToRun: 1
            ASPNETCORE_URLS: "https://+:${HttpsPort};http://+:${HttpPort}"
        volumes:
            - ./web/root/.aspnet/DataProtection-Keys:/root/.aspnet/DataProtection-Keys:rw
            - ./data/logs:/app/logs
        restart: always
        container_name: "btcadvisor-worker"
        depends_on:
            - db
        networks:
            - internal
    db:
        image: "postgres:16-bookworm" # PostgreSQL wird verwendet, das auf ARM läuft 
        container_name: "btcadvisor-postgres-db"
        restart: always
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${DB_USER} # Benutzername für die Datenbank
            POSTGRES_PASSWORD: ${DatabasePassword}
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U sa"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
  internal:
    driver: bridge
