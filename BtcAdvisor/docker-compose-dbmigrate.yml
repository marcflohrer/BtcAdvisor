services:
    web:
        build:
            context: .
            dockerfile: Dockerfile_DbMigrate
        container_name: "btcadvisor-worker"
        restart: no
        ports:
            - "${HttpPort}:6003"
            - "${HttpsPort}:6004"
        volumes:
            - ./web/root/.aspnet/DataProtection-Keys:/root/.aspnet/DataProtection-Keys:rw
            - ./data/logs:/app/logs
            - ./data/Migrations:/app/data/Migrations:rw
        environment:
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            ConnectionString: "Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DatabasePassword};SslMode=Disable;"
            ApiSettings__MarketDataAppApiKey: "${MARKETDATA_APP_APIKEY}"
            ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
            DOTNET_SYSTEM_NET_DISABLEIPV6: 1
        depends_on:
            - db
    db:
        image: "postgres:16-bookworm"  # PostgreSQL wird verwendet, das auf ARM läuft
        container_name: "btcadvisor-postgres-db"
        restart: always
        ports:
            - "${DatabasePort}:${DB_PORT}"
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${DB_USER}                       # Benutzer 'sa' fest definiert
            POSTGRES_PASSWORD: ${DatabasePassword}  # Passwort für den Benutzer 'sa'

